<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tap The Box Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== RESET ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ===== BODY ===== */
body {
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #111, #000);
  color: #fff;
  text-align: center;
  height: 100vh;
  overflow: hidden;
}

/* ===== TITLE ===== */
h1 {
  margin: 12px 0;
  color: #00ff99;
  text-shadow: 0 0 10px #00ff99;
}

/* ===== INFO BAR ===== */
.info {
  font-size: 15px;
  margin-bottom: 8px;
}

/* ===== GAME AREA ===== */
#game {
  position: relative;
  width: 100%;
  height: 80vh;
  background: #1b1b1b;
  border: 2px solid #00ff99;
  border-radius: 10px;
  overflow: hidden;
}

/* ===== BOX ===== */
.box {
  position: absolute;
  width: 55px;
  height: 55px;
  background: #00ff99;
  border-radius: 12px;
  box-shadow: 0 0 15px #00ff99;
  cursor: pointer;
  transition: left 0.4s linear, top 0.4s linear, transform 0.1s;
}

.box:active {
  transform: scale(0.9);
}
</style>
</head>

<body>

<h1>Tap The Box</h1>

<div class="info">
  Level: <span id="level">1</span> |
  Score: <span id="score">0</span> |
  High Score: <span id="high">0</span> |
  Time: <span id="time">30</span>s
</div>

<div id="game"></div>

<script>
/* ===== VARIABLES ===== */
let level = 1;
let score = 0;
let timeLeft = 30;
let timer;
let moveTimer;

/* ===== ELEMENTS ===== */
const game = document.getElementById("game");
const levelText = document.getElementById("level");
const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");
const highText = document.getElementById("high");

/* ===== HIGH SCORE ===== */
let highScore = localStorage.getItem("highScore") || 0;
highText.innerText = highScore;

/* ===== START GAME ===== */
startLevel();

/* ===== START LEVEL ===== */
function startLevel() {
  clearInterval(timer);
  clearInterval(moveTimer);
  game.innerHTML = "";

  timeLeft = level === 1 ? 30 : 20;

  levelText.innerText = level;
  scoreText.innerText = score;
  timeText.innerText = timeLeft;

  createBox();
  startTimer();
  startMove();
}

/* ===== TIMER ===== */
function startTimer() {
  timer = setInterval(() => {
    timeLeft--;
    timeText.innerText = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(timer);
      level++;
      startLevel();
    }
  }, 1000);
}

/* ===== CREATE ONE BOX ===== */
function createBox() {
  const box = document.createElement("div");
  box.className = "box";

  randomPosition(box);

  box.onclick = () => {
    score++;
    scoreText.innerText = score;

    if (score > highScore) {
      highScore = score;
      localStorage.setItem("highScore", highScore);
      highText.innerText = highScore;
    }

    randomPosition(box);
  };

  game.appendChild(box);
}

/* ===== MOVE BOX ===== */
function startMove() {
  moveTimer = setInterval(() => {
    const box = document.querySelector(".box");
    if (box) randomPosition(box);
  }, 700);
}

/* ===== RANDOM POSITION ===== */
function randomPosition(box) {
  const size = 55;
  const maxX = game.clientWidth - size;
  const maxY = game.clientHeight - size;

  box.style.left = Math.random() * maxX + "px";
  box.style.top = Math.random() * maxY + "px";
}
</script>

</body>
</html>
