<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tap The Box Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
    }

    h1 {
      margin: 10px 0;
    }

    .info {
      font-size: 18px;
      margin-bottom: 10px;
    }

    #game {
      position: relative;
      width: 100%;
      height: 80vh;
      background: #222;
      overflow: hidden;
    }

    .box {
      position: absolute;
      width: 60px;
      height: 60px;
      background: #00ff88;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 0 15px #00ff88;
      transition: transform 0.1s;
    }

    .box:active {
      transform: scale(0.9);
    }
  </style>
</head>

<body>

  <h1>Tap The Box</h1>

  <div class="info">
    Level: <span id="level">1</span> |
    Score: <span id="score">0</span> |
    Time: <span id="time">20</span>s
  </div>

  <div id="game"></div>

  <script>
    // ===== GAME VARIABLES =====
    let level = 1;
    let score = 0;
    let timeLeft = 20;
    let timer;

    const gameArea = document.getElementById("game");
    const levelText = document.getElementById("level");
    const scoreText = document.getElementById("score");
    const timeText = document.getElementById("time");

    // ===== START GAME =====
    startLevel();

    function startLevel() {
      clearInterval(timer);
      gameArea.innerHTML = "";

      timeLeft = 20;
      timeText.innerText = timeLeft;
      levelText.innerText = level;
      scoreText.innerText = score;

      createBoxes(level);
      startTimer();
    }

    // ===== TIMER =====
    function startTimer() {
      timer = setInterval(() => {
        timeLeft--;
        timeText.innerText = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timer);
          level++;
          startLevel();
        }
      }, 1000);
    }

    // ===== CREATE BOXES =====
    function createBoxes(count) {
      for (let i = 0; i < count; i++) {
        const box = document.createElement("div");
        box.className = "box";

        box.style.left = Math.random() * 85 + "%";
        box.style.top = Math.random() * 75 + "%";

        box.onclick = () => {
          score++;
          scoreText.innerText = score;
          box.remove();
        };

        gameArea.appendChild(box);
      }
    }
  </script>

</body>
</html>
